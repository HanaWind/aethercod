[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aethercod"
version = "0.1.0"
description = "A local, interconnected fantasy worldbuilding database."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "PySide6>=6.7",
    "Markdown>=3.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "black>=24.0"]

[project.scripts]
aethercod = "aethercod.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
